[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "srv6_mrc"
version = "0.1.0"
description = "SRv6 fabric emulator + per-EV MRC behavior layer (probes, EV state, loss fusion, EV-aware spray) for AI-cluster networking research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# Bundled host image installs these. Pure-Python so the package itself
# imports cleanly without them; only the runner/spray paths need scapy
# and only the scenario/route paths need PyYAML.
runtime = ["scapy>=2.5", "PyYAML>=6.0"]
dev = ["scapy>=2.5", "PyYAML>=6.0"]

[project.scripts]
# These get installed into the Docker image's /usr/local/bin
# via `pip install .` and become the user-facing CLI surface.
spray = "srv6_mrc.cli.spray:main"
routes = "srv6_mrc.cli.routes:main"
run-scenario = "srv6_mrc.mrc.run:main"
srctl = "srv6_mrc.cli.srctl:main"

[tool.setuptools.packages.find]
include = ["srv6_mrc*"]

[tool.setuptools.package-data]
srv6_mrc = ["py.typed"]
