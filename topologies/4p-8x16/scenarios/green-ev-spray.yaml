# green-ev-spray.yaml — EV-spray: vary BOTH plane and spine per packet.
#
# Phase 1b step 1 validation. Each packet's outer DA rotates through
# 4 planes * N spines = 4N entropy values (EVs). With paths_per_plane=8
# (the default = NUM_SPINES on 4p-8x16), this fans out across all 32
# leaf-spine paths.
#
# What to look for:
#   - per_plane_sent: balanced (round-robin still rotates planes fastest)
#   - per_ev_sent:    balanced across all (plane, spine) keys
#   - On the wire:    outer DA's `f<S>` hextet rotates packet-by-packet;
#                     tcpdump on a leaf eth1..eth4 shows multiple
#                     `fc00:000X:f00Y:...` values with Y ranging 0..7.
#
# Run:
#   sudo make scenario SCEN=green-ev-spray
name: green-ev-spray
description: |
  EV-spray across 8 spines * 4 planes (32 EVs per pair). Validates the
  data-path's per-packet outer-DA rotation. No faults — this is the
  EV-spray baseline; compare against `baseline.yaml` (plane-only spray).

paths_per_plane: 8

flows:
  - pairs: green-pairs-8
    policy: ev_spray
    rate: 1000pps
    duration: 5s

faults: []

report:
  out: results/green-ev-spray.json
