# yellow-ev-spray.yaml — full EV fan-out test for yellow tenant (4p-8x16)
#
# Purpose: Test per-packet outer-DA rotation across all spines (full EV grid)
#
# Policy: ev_spray (rotates BOTH plane and spine per packet)
# EVs used: 32 (4 planes × 8 spines)
# Paths per plane: 8 (explicit)
#
# This is the yellow counterpart to green-ev-spray.yaml on the larger 4p-8x16
# topology. Key differences from yellow-baseline:
#   - Uses all 32 EVs instead of just 4
#   - Tests that per-packet spine rotation works correctly
#   - Validates runner rebuilds outer SID list on every packet
#   - Regression check: yellow's extra `e009` hop survives per-packet rotation
#
# Yellow tenant specifics:
#   - Outer SID list has TWO variable hextets: `f<S>` (spine) + `e009` (host hop)
#   - Each packet's `f<S>` rotates (0→1→...→7), `e009` stays constant
#   - More complex wire format than green (which only has one variable hextet)
#
# Use this scenario to:
#   - Validate full EV data-path works on yellow tenant at scale
#   - Test per-packet SID list rebuild logic with 8 spines
#   - Verify outer DA construction for yellow's extra hop
#
# What to look for:
#   - per_plane_sent: balanced across 4 planes (~25% each)
#   - per_ev_sent: balanced across all 32 (plane, spine) pairs (~3.125% each)
#   - On wire: outer DA's `f<S>` hextet rotates packet-by-packet
#
# Compare to yellow-baseline: that scenario uses only 4 EVs (round_robin)
# for quick smoke testing; this uses all 32 EVs for full data-path validation.
name: yellow-ev-spray
description: |
  Yellow tenant EV-spray over 8 spines * 4 planes (32 EVs per pair).
  Validates that yellow's extra leaf->host hop (`e009`) survives
  per-packet outer-SID rotation. Companion to green-ev-spray.yaml.

paths_per_plane: 8

flows:
  - pairs: yellow-pairs-8
    policy: ev_spray
    rate: 500pps
    duration: 5s

faults: []

report:
  out: results/yellow-ev-spray.json
