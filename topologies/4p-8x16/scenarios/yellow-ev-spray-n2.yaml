# yellow-ev-spray-n2.yaml — yellow EV-spray, narrow fan-out (n=2).
#
# Yellow analogue of green-ev-spray-n2.yaml. Easier lab-verification
# variant: only 2 spines per pair, so each pair walks 4 planes * 2
# spines = 8 EVs. Per-pair spine subset is hash-derived (see
# topo.select_spines_for_addrs), so different pairs land on
# different spine pairs.
#
# Doubles as a smoke test for yellow's host-side End.DT6 decap under
# spine rotation — if any spine in a pair's subset can't deliver
# packets back to the receiver's `cccc:NN::2`, the loss will show up
# as a 12.5%-or-so clip on that flow (1 lossy EV out of 8 = 12.5%),
# the same signature we observed on green when fabric plane 2 was
# misbehaving.
#
# Run:
#   sudo make scenario SCEN=yellow-ev-spray-n2
name: yellow-ev-spray-n2
description: |
  Yellow tenant EV-spray with paths_per_plane=2. Per-pair fan-out
  is 8 EVs; per-pair tcpdump shows alternating `f<S>` hextet between
  exactly two values. Companion to green-ev-spray-n2.yaml; useful
  for visual wire-form validation of yellow's 2-uSID outer header.

paths_per_plane: 2

flows:
  - pairs: yellow-pairs-8
    policy: ev_spray
    rate: 1000pps
    duration: 5s

faults: []

report:
  out: results/yellow-ev-spray-n2.json
