# full-mesh.yaml — every host talks to every other host of the same tenant.
#
# This expands to:
#   8 hosts * 7 peers / 2  = 28 unique pairs per tenant
#   28 pairs * 2 tenants   = 56 pairs total
#
# Use this to validate spray.py across arbitrary host combinations or have
# everything reachable for ad-hoc pings.
#
# Apply with:
#   ./routes.py apply -f routes/full-mesh.yaml
apiVersion: srv6-lab/v1
kind: RouteSet
metadata:
  name: full-mesh
spec:
  mesh:
    - tenant: green
      src: [0, 1, 2, 3, 4, 5, 6, 7]
      dst: [0, 1, 2, 3, 4, 5, 6, 7]
      # self-pairs (src == dst) are dropped automatically
      # the reverse pair (7->0 vs 0->7) is canonicalized and deduped
    - tenant: yellow
      src: [0, 1, 2, 3, 4, 5, 6, 7]
      dst: [0, 1, 2, 3, 4, 5, 6, 7]
