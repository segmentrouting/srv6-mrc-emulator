# yellow-allreduce-ring.yaml — NCCL-style ring all-reduce step (yellow).
#
# Emulates one step of NCCL's ring all-reduce, the dominant collective
# pattern in production AI training. Each of the N hosts sends
# concurrently to its right neighbor:
#
#   host00 -> host01
#   host01 -> host02
#   ...
#   host14 -> host15
#   host15 -> host00      (ring wraps)
#
# Real all-reduce is 2(N-1) such steps — reduce-scatter (N-1 steps)
# followed by all-gather (N-1 steps) — with the "interesting chunk"
# rotated around the ring each step. We model one step with sustained
# traffic, which captures the per-link load characteristic without the
# multi-step orchestration overhead. The wire pattern is what matters
# for fabric/MRC behavior; the application-level reduction is opaque.
#
# Why this is interesting:
#   - Every host both sends AND receives concurrently — no idle hosts,
#     unlike all-to-all where some leaf links carry no traffic at any
#     given instant.
#   - Logical adjacency != physical adjacency. host00 and host01 are on
#     different leaves; the ring traverses the fabric N times, not the
#     N-1 hops a physical ring would. So MRC has the full EV grid to
#     spray over for each ring hop.
#   - Bandwidth-optimal pattern: in real all-reduce, N flows of B bytes
#     each / N = B bytes per host throughput, independent of N. The
#     fabric carries N*B bytes total per step.
#
# What to look for:
#   - per_plane_sent: balanced; 16 flows * 32 EVs = 512 EV cells active
#     across the fabric, plenty of entropy.
#   - per leaf eth1..eth4: should see roughly 16/16 = 1 flow's worth of
#     egress + 1 flow's worth of ingress (ring is balanced by design).
#   - With MRC: a port shutdown affects ~2 of the 16 flows (those whose
#     spine-hash subset includes the broken (plane, spine) cell).
#
# Run:
#   make scenario SCEN=yellow-allreduce-ring

name: yellow-allreduce-ring
description: |
  NCCL-style ring all-reduce (yellow tenant): 16 hosts, 16 concurrent
  flows, each host sending to its right neighbor at 100 pps.
  Models one step of a bandwidth-optimal ring all-reduce — the dominant
  pattern in production AI training.

paths_per_plane: 4

flows:
  - pairs: yellow-ring
    policy: health_aware_mrc
    rate: 100pps
    duration: 60s

faults: []

mrc: {}

report:
  out: results/yellow-allreduce-ring.json
