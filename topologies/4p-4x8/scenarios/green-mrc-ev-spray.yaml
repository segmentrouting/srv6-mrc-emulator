# green-mrc-ev-spray.yaml — green tenant, health_aware_mrc with full
# EV fan-out (4 planes * 4 spines = 16 EVs per src/dst pair).
#
# Green counterpart of yellow-mrc-ev-spray.yaml. Same per-EV health-
# feedback test surface but on the simpler one-uSID outer (leaf-decap
# End.DT6) data path. Use this as the cleaner baseline when debugging
# the MRC feedback loop end-to-end — if green works and yellow doesn't,
# the bug is in the host-side decap / 2-uSID outer; if both fail, the
# bug is in the MRC plumbing itself.
#
# What to look for: same as yellow-mrc-ev-spray.yaml. Pre-failure
# uniform ~6.25% per EV; post-failure the broken (plane, path) cell
# drops to ~0% and the remaining 15 EVs absorb its share.
#
# Failure injection: use srctl fault commands —
# `srctl fault shutdown p<P>-spine<S> Ethernet<port>`
# breaks EV (plane=P, path=S) for any flow landing on that leaf.
#
# Run:
#   make scenario SCEN=green-mrc-ev-spray

name: green-mrc-ev-spray
description: |
  Green tenant health_aware_mrc spray with full per-EV fan-out
  (16 EVs per pair). Companion to yellow-mrc-ev-spray.yaml; same
  per-EV loss-attribution and rebalancing semantics on green's
  leaf-decap End.DT6 data path.

paths_per_plane: 4

flows:
  - pairs: green-pairs
    policy: health_aware_mrc
    rate: 100pps
    duration: 30s

faults: []

mrc: {}

report:
  out: results/green-mrc-ev-spray.json
