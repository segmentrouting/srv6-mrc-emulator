# green-mrc-plane-loss.yaml — 5% loss on plane 2, health_aware_mrc spray.
#
# DEPRECATED: This scenario uses embedded faults: blocks. Use the new
# srctl fault injection workflow instead:
#
#   srctl fault netem "host green-host00 plane 2" "loss 5%"
#   srctl run green-mrc-baseline --duration 10
#   srctl fault clear --all
#
# See AGENTS.md "srctl fault" section for full documentation.
#
# Headline MRC scenario. Inject loss on a single plane; the receiver's
# loss-window thread observes ~5% loss, sends LossReport frames back to
# the sender; the sender's EVStateTable demotes plane 2 (UNKNOWN ->
# ASSUMED_BAD once loss_demote_consecutive windows in a row exceed
# loss_threshold). The spray weights then shift away from plane 2 to
# the remaining three healthy planes, dropping the effective loss rate.
#
# Tighter knobs vs defaults: shorter loss_window_ms and lower
# loss_demote_consecutive so the demotion happens well within the 8s
# scenario duration. Defaults are tuned for steadier production
# workloads where you don't want to demote on a single noisy window.
#
# Run:
#   make scenario SCEN=green-mrc-plane-loss

name: green-mrc-plane-loss
description: |
  Inject 5% random loss on plane 2 of green-host00's uplink, then spray
  with health_aware_mrc. The MRC agents should detect the loss within a
  second or two and shift traffic to planes 0/1/3, lowering total loss
  well below the round_robin reference.

flows:
  - pairs:
      - { tenant: green, src: 0, dst: 7 }
    policy: health_aware_mrc
    rate: 500pps
    duration: 10s

faults:
  - kind: netem
    target: host green-host00 plane 2
    spec: loss 5%

mrc:
  # Shorter windows + lower demote-consecutive: we want a visible
  # demotion inside the 8s run. Production defaults (200ms/2) would
  # also work but leave less of the run on the post-demotion regime.
  loss_window_ms: 100
  loss_demote_consecutive: 2

report:
  out: results/green-mrc-plane-loss.json
