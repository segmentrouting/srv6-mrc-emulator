# green-ev-spray.yaml — full EV fan-out test without MRC probes
#
# Purpose: Validate per-packet outer-DA rotation across all spines
#
# Policy: ev_spray (rotates BOTH plane and spine per packet)
# EVs used: 16 (4 planes × 4 spines)
# Paths per plane: 4 (explicit)
# MRC enabled: no (pure data-path test, no probes or health awareness)
#
# This tests the EV-spray data-path in isolation. Each packet gets a unique
# outer SID list, walking through all 16 (plane, spine) combinations. This
# validates the runner's per-packet SID list construction without the
# complexity of MRC probes and health state.
#
# Use this scenario to:
#   - Test EV-spray data-path works correctly
#   - Validate per-packet outer-DA rotation logic
#   - Quick regression for SID list construction
#   - Baseline for green-mrc-ev-spray (same data-path, adds MRC)
#
# Green tenant specifics:
#   - Leaf-decap via `End.DT6` into `Vrf-green`
#   - Outer DA has one variable hextet: `f<S>` (spine id)
#   - Simpler than yellow (no extra `e009` hop)
#
# What to look for:
#   - per_plane_sent: balanced across 4 planes (~25% each)
#   - per_ev_sent: balanced across all 16 EVs (~6.25% each)
#   - On wire: outer DA's `f<S>` hextet rotates (0→1→2→3) packet-by-packet
#   - tcpdump on leaf eth1..eth4: see `fc00:000X:f00Y:...` with Y=0..3
#
# Compare to:
#   - green-baseline: uses MRC with 4 EVs (one per plane)
#   - green-mrc-ev-spray: same 16-EV fan-out but with MRC enabled
#   - yellow-ev-spray: same test pattern but for yellow tenant (extra hop)
name: green-ev-spray
description: |
  EV-spray across 4 spines * 4 planes (16 EVs per pair). Validates the
  data-path's per-packet outer-DA rotation. No faults — this is the
  EV-spray baseline.

paths_per_plane: 4

flows:
  - pairs: green-pairs
    policy: ev_spray
    rate: 500pps
    duration: 5s

faults: []

report:
  out: results/green-ev-spray.json
